<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pro Video App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 380px; }
        .form-control { background: #2a2a2a; border: 1px solid #444; color: white; }
        .form-control:focus { background: #333; color: white; }
    </style>
</head>
<body>
<div class="card p-4">
    <h3 class="text-center mb-3 text-primary"><i class="fas fa-user-plus"></i> Register</h3>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2 mb-2 fs-6">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/register" method="POST">
        <div class="mb-3">
            <label>User Name</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Register</button>
    </form>
    <p class="text-center mt-3 text-secondary mb-0">Already have an account? <a href="/login" class="text-primary">Login</a></p>
</div>
</body>
</html>
