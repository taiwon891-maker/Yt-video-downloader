<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; padding-bottom: 70px; font-family: Roboto, Arial, sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .download-panel-animation { animation: panelIn .2s ease; }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tag-btn.active { background-color: #0f0f0f; color: #ffffff; }
    </style>
</head>
<body class="bg-white text-black">

<!-- HEADER -->
<header class="flex items-center justify-between px-4 h-14 sticky top-0 bg-white z-50 border-b border-gray-100">
    <div class="flex items-center space-x-3">
        <div onclick="resetFeed()" class="flex items-center space-x-1 cursor-pointer">
            <i class="fa-brands fa-youtube text-red-600 text-3xl"></i>
            <span class="font-bold text-xl tracking-tighter">YouTube</span>
        </div>
    </div>

    <!-- Desktop Search -->
    <div class="hidden md:flex items-center flex-1 max-w-xl mx-8">
        <div class="flex w-full border border-gray-300 rounded-l-full px-4 py-1.5">
            <input type="text" id="searchInput" placeholder="Search YouTube" onkeydown="if(event.key === 'Enter') searchVideos()" class="w-full outline-none text-sm">
        </div>
        <button onclick="searchVideos()" class="bg-gray-100 border border-l-0 border-gray-300 px-6 py-1.5 rounded-r-full text-gray-700">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center space-x-4">
        <button onclick="toggleMobileSearch()" class="md:hidden text-xl text-gray-700"><i class="fa-solid fa-magnifying-glass"></i></button>
        <a href="/logout" class="text-xl text-gray-700" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
        <div class="w-8 h-8 bg-red-600 text-white rounded-full flex items-center justify-center font-bold text-sm">
            {{ username[0].upper() if username else 'U' }}
        </div>
    </div>
</header>

<!-- MOBILE SEARCH BAR -->
<div id="mobileSearch" class="hidden px-4 py-2 bg-white border-b md:hidden">
    <div class="flex">
        <input type="text" id="mobileSearchInput" placeholder="Search YouTube" onkeydown="if(event.key === 'Enter') mobileSearchVideos()" class="w-full border border-gray-300 rounded-l-full px-4 py-2 text-sm outline-none">
        <button onclick="mobileSearchVideos()" class="bg-gray-100 border border-l-0 border-gray-300 px-4 rounded-r-full">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</div>

<!-- CATEGORY BAR -->
<nav class="flex space-x-2 px-4 py-2.5 overflow-x-auto scrollbar-hide border-b border-gray-200 sticky top-14 bg-white z-40">
    <button onclick="filterCategory('All', this)" class="tag-btn active bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">All</button>
    <button onclick="filterCategory('Bangla Natok', this)" class="tag-btn bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">Drama</button>
    <button onclick="filterCategory('Bangla Songs', this)" class="tag-btn bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">Music</button>
    <button onclick="filterCategory('Tech News', this)" class="tag-btn bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">Tech</button>
    <button onclick="filterCategory('News', this)" class="tag-btn bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">News</button>
    <button onclick="filterCategory('Gaming', this)" class="tag-btn bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap">Gaming</button>
</nav>

<!-- MAIN CONTENT CONTAINER -->
<main class="max-w-7xl mx-auto p-2 sm:p-4">

    <!-- WATCH VIEW PLAYER (FIXED PLAYBACK ISSUE) -->
    <div id="watchView" class="hidden mb-6 bg-black rounded-xl overflow-hidden shadow-lg sticky top-28 z-40">
        <div class="w-full aspect-video">
            <iframe id="mainPlayer" class="w-full h-full" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="p-3 bg-white border-t flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 id="watchTitle" class="text-base font-bold line-clamp-2">ভিডিও সিলেক্ট করুন</h1>
                <p id="watchChannel" class="text-xs text-gray-500">YouTube Channel</p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="startDownload('mp4')" class="flex-1 sm:flex-none bg-red-600 text-white hover:bg-red-700 px-4 py-1.5 rounded-full text-xs font-semibold">
                    <i class="fa-solid fa-download me-1"></i> MP4
                </button>
                <button onclick="startDownload('mp3')" class="flex-1 sm:flex-none bg-black text-white hover:bg-gray-800 px-4 py-1.5 rounded-full text-xs font-semibold">
                    <i class="fa-solid fa-music me-1"></i> MP3
                </button>
            </div>
        </div>
    </div>

    <!-- VIDEO FEED GRID -->
    <div id="videoFeed" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    <div id="loader" class="text-center py-6 hidden"><i class="fa-solid fa-spinner fa-spin text-2xl text-red-600"></i></div>
</main>

<!-- DOWNLOAD PANEL -->
<div id="downloadPanel" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto download-panel-animation">
    <div class="sticky top-0 bg-white border-b px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="closeDownloadPanel()" class="text-xl"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="font-bold text-lg">Downloads</h2>
        </div>
    </div>

    <div class="max-w-3xl mx-auto p-4 text-center py-10">
        <p class="text-gray-600 text-sm mb-4">বর্তমানে প্লে হওয়া ভিডিও ডাউনলোড করুন:</p>
        <p id="downloadSelectedTitle" class="font-bold text-base mb-6 text-gray-800">কোনো ভিডিও প্লে করা হয়নি</p>
        <div class="flex justify-center gap-4">
            <button onclick="startDownload('mp4')" class="bg-red-600 text-white px-6 py-2.5 rounded-full font-bold text-sm shadow hover:bg-red-700">
                <i class="fa-solid fa-video me-2"></i> Download MP4
            </button>
            <button onclick="startDownload('mp3')" class="bg-black text-white px-6 py-2.5 rounded-full font-bold text-sm shadow hover:bg-gray-800">
                <i class="fa-solid fa-music me-2"></i> Download MP3
            </button>
        </div>
    </div>
</div>

<!-- BOTTOM NAVIGATION BAR -->
<footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-50">
    <button onclick="resetFeed()" class="flex flex-col items-center text-red-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-1">Home</span>
    </button>
    <button onclick="loadShorts()" class="flex flex-col items-center text-gray-600 hover:text-black">
        <i class="fa-solid fa-bolt text-lg"></i>
        <span class="text-[10px] mt-1">Shorts</span>
    </button>
    <button onclick="openDownloadPanel()" class="flex flex-col items-center text-gray-600 hover:text-black">
        <i class="fa-solid fa-download text-lg"></i>
        <span class="text-[10px] mt-1">Download</span>
    </button>
</footer>

<script>
    let nextPageToken = "";
    let currentQuery = "Bangla new songs";
    let playingUrl = "";
    let isLoading = false;

    async function loadVideos(q, append = false) {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loader').classList.remove('hidden');

        try {
            const res = await fetch(`/search?q=${encodeURIComponent(q)}&pageToken=${nextPageToken}`);
            const data = await res.json();
            const feed = document.getElementById('videoFeed');

            if (!append) feed.innerHTML = "";

            data.videos.forEach(v => {
                const cleanTitle = v.title.replace(/'/g, "");
                feed.innerHTML += `
                    <div class="cursor-pointer group" onclick="playVideo('${v.url}', '${v.videoId}', '${cleanTitle}', '${v.channel}')">
                        <div class="relative aspect-video rounded-xl overflow-hidden bg-gray-200">
                            <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
                        </div>
                        <div class="flex gap-3 mt-3">
                            <div class="w-9 h-9 rounded-full bg-gray-300 flex-shrink-0 flex items-center justify-center font-bold text-sm text-gray-700">
                                ${v.channel ? v.channel[0] : 'C'}
                            </div>
                            <div>
                                <h3 class="font-semibold text-sm line-clamp-2 leading-snug">${v.title}</h3>
                                <p class="text-xs text-gray-600 mt-1">${v.channel}</p>
                            </div>
                        </div>
                    </div>`;
            });
            nextPageToken = data.nextPageToken || "";
        } catch (e) {}

        document.getElementById('loader').classList.add('hidden');
        isLoading = false;
    }

    function playVideo(url, videoId, title, channel) {
        playingUrl = url;
        document.getElementById('watchTitle').innerText = title;
        document.getElementById('watchChannel').innerText = channel;
        document.getElementById('downloadSelectedTitle').innerText = title;
        
        // youtube-nocookie এবং প্রয়োজনীয় প্যারামিটার যুক্ত করে এরর ফিক্স করা হয়েছে
        document.getElementById('mainPlayer').src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1&rel=0`;
        
        document.getElementById('watchView').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadShorts() {
        document.getElementById('watchView').classList.add('hidden');
        document.getElementById('mainPlayer').src = "";
        currentQuery = "#shorts";
        nextPageToken = "";
        loadVideos(currentQuery);
    }

    function filterCategory(cat, btn) {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentQuery = cat === 'All' ? 'Bangla new songs' : cat;
        nextPageToken = "";
        loadVideos(currentQuery);
    }

    function searchVideos() {
        const query = document.getElementById('searchInput').value;
        if (query) {
            currentQuery = query;
            nextPageToken = "";
            loadVideos(query);
        }
    }

    function toggleMobileSearch() {
        document.getElementById('mobileSearch').classList.toggle('hidden');
    }

    function mobileSearchVideos() {
        const query = document.getElementById('mobileSearchInput').value;
        if (query) {
            currentQuery = query;
            nextPageToken = "";
            loadVideos(query);
            toggleMobileSearch();
        }
    }

    function resetFeed() {
        document.getElementById('watchView').classList.add('hidden');
        document.getElementById('mainPlayer').src = "";
        currentQuery = "Bangla new songs";
        nextPageToken = "";
        loadVideos(currentQuery);
    }

    function openDownloadPanel() {
        document.getElementById('downloadPanel').classList.remove('hidden');
    }

    function closeDownloadPanel() {
        document.getElementById('downloadPanel').classList.add('hidden');
    }

    function startDownload(type) {
        if (!playingUrl) return alert("প্রথমে একটি ভিডিও প্লে করুন।");
        let cleanUrl = encodeURIComponent(playingUrl);
        let downloadLink = type === 'mp3' 
            ? `https://loader.to/api/card/?url=${cleanUrl}&f=mp3`
            : `https://loader.to/api/card/?url=${cleanUrl}&f=720`;
            
        window.open(downloadLink, '_blank');
    }

    window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
            if (nextPageToken) {
                loadVideos(currentQuery, true);
            }
        }
    };

    window.onload = () => {
        loadVideos(currentQuery);
    };
</script>
</body>
</html>
