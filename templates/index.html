<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #ff0050; 
            --accent: #00f2fe;
            --dark-bg: #0f0f12; 
            --card-bg: #18181c; 
            --card-hover: #222228;
        }
        
        body { 
            background: var(--dark-bg); 
            color: #f1f1f1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding-bottom: 75px; 
        }

        /* স্টাইলিশ গ্লাস হেডার */
        .header { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: rgba(15, 15, 18, 0.85); 
            backdrop-filter: blur(12px); 
            padding: 12px 15px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .search-bar { 
            background: #202025; 
            border: 1px solid #33333d; 
            color: white; 
            border-radius: 30px; 
            padding-left: 18px; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .search-bar:focus {
            background: #282830;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 0, 80, 0.3);
            color: white;
        }

        /* ফিক্সড ভিডিও প্লেয়ার (Top Sticky) */
        .player-wrapper { 
            position: sticky; 
            top: 61px; 
            z-index: 999; 
            background: #000; 
            border-bottom: 1px solid #2a2a35;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .embed-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
        }
        .embed-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
        
        /* ভিডিও কার্ডস ডিজাইন */
        .v-card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            overflow: hidden; 
            margin-bottom: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            cursor: pointer; 
            transition: transform 0.2s, background 0.2s;
        }
        .v-card:active { transform: scale(0.98); }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .v-title { padding: 12px; font-size: 13.5px; font-weight: 600; height: 58px; overflow: hidden; line-height: 1.3; color: #e1e1e1; }
        
        /* হিস্ট্রি কার্ড */
        .history-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .history-card img { width: 90px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 12px; }
        .history-title { font-size: 13px; font-weight: 500; color: #ddd; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* বটম নেভিগেশন */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: rgba(18, 18, 22, 0.95); 
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: space-around; 
            padding: 8px 0; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            z-index: 2000; 
        }
        .nav-btn { background: none; border: none; color: #777; font-size: 10px; flex: 1; font-weight: 600; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn i { font-size: 18px; display: block; margin-bottom: 2px; }
        
        .section { display: none; padding-top: 8px; }
        .section.active { display: block; }
        
        .action-btn { 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 11px; 
            padding: 5px 12px;
        }
    </style>
</head>
<body>

<!-- হেডার / সার্চ বার -->
<div class="header d-flex align-items-center justify-content-between">
    <div class="input-group me-2">
        <input type="text" id="searchInput" class="form-control search-bar" placeholder="গান বা ভিডিও সার্চ করুন...">
        <button class="btn btn-danger rounded-circle ms-2 px-3" onclick="handleSearch()"><i class="fas fa-search"></i></button>
    </div>
    <a href="/logout" class="btn btn-outline-secondary btn-sm text-nowrap rounded-circle p-2"><i class="fas fa-sign-out-alt"></i></a>
</div>

<!-- Home সেকশন (উপরে ভিডিও প্লেয়ার, নিচে আনলিমিটেড স্ক্রোল ভিডিও) -->
<div id="home-sec" class="section active">
    
    <!-- ফিক্সড স্টিকি প্লেয়ার -->
    <div class="player-wrapper">
        <div class="embed-container">
            <iframe id="playerIframe" src="" allowfullscreen></iframe>
        </div>
        <div class="p-2 px-3 bg-dark d-flex justify-content-between align-items-center">
            <small id="playTitle" class="text-truncate me-2 text-warning fw-semibold" style="max-width: 55%;">ভিডিও প্লে করতে নিচে ক্লিক করুন</small>
            <div>
                <button onclick="startDownload('mp4')" class="btn btn-info btn-sm action-btn"><i class="fas fa-download"></i> MP4</button>
                <button onclick="startDownload('mp3')" class="btn btn-warning btn-sm action-btn"><i class="fas fa-music"></i> MP3</button>
            </div>
        </div>
    </div>

    <!-- আনলিমিটেড ভিডিও ফিড -->
    <div class="container mt-3">
        <div id="video-feed" class="row row-cols-1 row-cols-md-2 row-cols-lg-3"></div>
        <div id="loader" class="text-center p-3" style="display:none;"><div class="spinner-border text-danger"></div></div>
    </div>
</div>

<!-- Downloads সেকশন -->
<div id="download-sec" class="section container">
    <h6 class="mb-3 text-danger fw-bold"><i class="fas fa-download me-2"></i>ডাউনলোড পেজ</h6>
    <div class="p-3 bg-dark rounded-4 border border-secondary text-center shadow">
        <p class="mb-1 text-secondary small">বর্তমানে সিলেক্ট করা ভিডিও:</p>
        <p id="downloadSelectedTitle" class="fw-bold text-info">কোনো ভিডিও প্লে করা হয়নি</p>
        <hr class="border-secondary my-3">
        <div class="d-grid gap-2 col-11 mx-auto">
            <button onclick="startDownload('mp4')" class="btn btn-info fw-bold py-2 rounded-3"><i class="fas fa-video me-1"></i> Download MP4 Video</button>
            <button onclick="startDownload('mp3')" class="btn btn-warning fw-bold py-2 rounded-3"><i class="fas fa-music me-1"></i> Download MP3 Audio</button>
        </div>
    </div>
</div>

<!-- History সেকশন -->
<div id="history-sec" class="section container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0 text-danger fw-bold"><i class="fas fa-history me-2"></i>প্লে হিস্ট্রি</h6>
        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="clearHistory()"><i class="fas fa-trash me-1"></i>Clear</button>
    </div>
    <div id="history-list"></div>
</div>

<!-- বটম নেভিগেশন বার -->
<div class="bottom-nav">
    <button class="nav-btn active" onclick="showSection('home', this)"><i class="fas fa-home"></i>Home</button>
    <button class="nav-btn" onclick="showSection('download', this)"><i class="fas fa-download"></i>Downloads</button>
    <button class="nav-btn" onclick="showSection('history', this)"><i class="fas fa-history"></i>History</button>
</div>

<script>
    let nextPageToken = "";
    let currentQuery = "Bangla new songs";
    let playingUrl = "";
    let isLoading = false;
    let playHistory = JSON.parse(localStorage.getItem('user_history') || '[]');

    // ১. ভিডিও সার্চ ও ফিড লোড
    async function loadVideos(q, append = false) {
        if(isLoading) return;
        isLoading = true;
        document.getElementById('loader').style.display = "block";
        
        try {
            const res = await fetch(`/search?q=${encodeURIComponent(q)}&pageToken=${nextPageToken}`);
            const data = await res.json();
            
            const feed = document.getElementById('video-feed');
            if (!append) feed.innerHTML = "";
            
            data.videos.forEach(v => {
                const cleanTitle = v.title.replace(/'/g, "");
                feed.innerHTML += `
                    <div class="col">
                        <div class="v-card" onclick="playThis('${v.url}', '${v.videoId}', '${cleanTitle}', '${v.thumbnail}')">
                            <img src="${v.thumbnail}">
                            <div class="v-title">${v.title}</div>
                        </div>
                    </div>`;
            });
            nextPageToken = data.nextPageToken || "";
        } catch(e) {}
        
        document.getElementById('loader').style.display = "none";
        isLoading = false;
    }

    // ২. ভিডিও প্লে করা ও হিস্ট্রি সেভ করা
    function playThis(url, videoId, title, thumbnail) {
        playingUrl = url;
        document.getElementById('playTitle').innerText = title;
        document.getElementById('downloadSelectedTitle').innerText = title;
        document.getElementById('playerIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        
        // হিস্ট্রিতে যোগ করা
        addToHistory({ url, videoId, title, thumbnail });
        
        // হোম সেকশনে নিয়ে যাওয়া এবং উপরে স্ক্রোল করা
        showSection('home', document.querySelectorAll('.nav-btn')[0]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ৩. হিস্ট্রি প্রসেস ও রেন্ডার
    function addToHistory(item) {
        // ডুপ্লিকেট রিমুভ
        playHistory = playHistory.filter(h => h.videoId !== item.videoId);
        playHistory.unshift(item); // একদম উপরে যোগ করা
        localStorage.setItem('user_history', JSON.stringify(playHistory));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-list');
        if(playHistory.length === 0) {
            container.innerHTML = `<p class="text-center text-secondary mt-4">এখনো কোনো প্লে হিস্ট্রি নেই</p>`;
            return;
        }
        
        container.innerHTML = "";
        playHistory.forEach(item => {
            const cleanTitle = item.title.replace(/'/g, "");
            container.innerHTML += `
                <div class="history-card" onclick="playThis('${item.url}', '${item.videoId}', '${cleanTitle}', '${item.thumbnail}')">
                    <img src="${item.thumbnail}">
                    <div class="history-title">${item.title}</div>
                </div>`;
        });
    }

    function clearHistory() {
        playHistory = [];
        localStorage.removeItem('user_history');
        renderHistory();
    }

    // ৪. সেকশন পরিবর্তন
    function showSection(name, element) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name + '-sec').classList.add('active');
        if(element) element.classList.add('active');
    }

    // ৫. সার্চ হ্যান্ডলার
    function handleSearch() {
        const val = document.getElementById('searchInput').value;
        if(val.includes('youtube.com') || val.includes('youtu.be')) {
            let vid = val.split('v=')[1] || val.split('/').pop();
            playThis(val, vid, "Custom Link Video", "https://img.youtube.com/vi/"+vid+"/hqdefault.jpg");
        } else {
            currentQuery = val;
            nextPageToken = "";
            loadVideos(val);
            showSection('home', document.querySelectorAll('.nav-btn')[0]);
        }
    }

    // ৬. ডাউনলোড ট্রিগার
    function startDownload(type) {
        if(!playingUrl) return alert("প্রথমে একটি ভিডিও প্লে করুন।");
        let cleanUrl = encodeURIComponent(playingUrl);
        let downloadLink = type === 'mp3' 
            ? `https://loader.to/api/card/?url=${cleanUrl}&f=mp3`
            : `https://loader.to/api/card/?url=${cleanUrl}&f=720`;
            
        window.open(downloadLink, '_blank');
    }

    // ৭. আনলিমিটেড স্ক্রলিং
    window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
            if(document.getElementById('home-sec').classList.contains('active') && nextPageToken) {
                loadVideos(currentQuery, true);
            }
        }
    };

    window.onload = () => {
        loadVideos(currentQuery);
        renderHistory();
    };
</script>

</body>
</html>
