<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff0050; --dark: #121212; --card: #1e1e1e; }
        body { background: var(--dark); color: white; font-family: sans-serif; padding-bottom: 80px; }
        .header { position: sticky; top: 0; z-index: 1000; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px); padding: 15px; border-bottom: 1px solid #333; }
        .search-bar { background: #222; border: 1px solid #444; color: white; border-radius: 50px; padding-left: 20px; }
        .v-card { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid #222; cursor: pointer; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .v-title { padding: 10px; font-size: 14px; font-weight: bold; height: 55px; overflow: hidden; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 2000; }
        .nav-btn { background: none; border: none; color: #888; font-size: 11px; flex: 1; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn i { font-size: 20px; display: block; }
        .section { display: none; padding-top: 10px; }
        .section.active { display: block; }
        .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 10px; }
        .embed-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .download-btn { border-radius: 50px; font-weight: bold; font-size: 12px; margin: 3px; }
        .list-item { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control search-bar" placeholder="গান খুঁজুন বা লিঙ্ক দিন...">
        <button class="btn btn-danger rounded-circle ms-2" onclick="handleSearch()"><i class="fas fa-search"></i></button>
    </div>
</div>

<div class="container mt-2">
    <div id="home-sec" class="section active">
        <div id="video-feed" class="row row-cols-1 row-cols-md-2 row-cols-lg-3"></div>
        <div id="loader" class="text-center p-3" style="display:none;"><div class="spinner-border text-danger"></div></div>
    </div>

    <div id="playing-sec" class="section">
        <div class="embed-container">
            <iframe id="playerIframe" src="" allowfullscreen></iframe>
        </div>
        <div class="p-3 mt-2 bg-dark rounded shadow">
            <h6 id="playTitle">ভিডিও নির্বাচন করুন</h6>
            <div class="d-flex flex-wrap mt-3">
                <button onclick="startDownload('720p')" class="btn btn-info download-btn"><i class="fas fa-download me-1"></i> Download MP4</button>
                <button onclick="startDownload('mp3')" class="btn btn-warning download-btn"><i class="fas fa-music me-1"></i> Download MP3</button>
            </div>
        </div>
    </div>

    <div id="history-sec" class="section">
        <h5 class="mb-3"><i class="fas fa-history me-2"></i>প্লে হিস্ট্রি</h5>
        <div id="history-list"></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn active" onclick="showSection('home', this)"><i class="fas fa-home"></i>Home</button>
    <button class="nav-btn" onclick="showSection('playing', this)"><i class="fas fa-play"></i>Playing</button>
    <button class="nav-btn" onclick="showSection('history', this)"><i class="fas fa-history"></i>History</button>
</div>

<script>
    let nextPageToken = "";
    let currentQuery = "Bangla new songs";
    let playingUrl = "";

    async function loadVideos(q, append = false) {
        document.getElementById('loader').style.display = "block";
        const res = await fetch(`/search?q=${encodeURIComponent(q)}&pageToken=${nextPageToken}`);
        const data = await res.json();
        
        const feed = document.getElementById('video-feed');
        if (!append) feed.innerHTML = "";
        
        data.videos.forEach(v => {
            const cleanTitle = v.title.replace(/'/g, "");
            feed.innerHTML += `
                <div class="col">
                    <div class="v-card" onclick="playThis('${v.url}', '${v.videoId}', '${cleanTitle}')">
                        <img src="${v.thumbnail}">
                        <div class="v-title">${v.title}</div>
                    </div>
                </div>`;
        });
        nextPageToken = data.nextPageToken || "";
        document.getElementById('loader').style.display = "none";
    }

    function playThis(url, videoId, title) {
        playingUrl = url;
        showSection('playing');
        document.getElementById('playTitle').innerText = title;
        document.getElementById('playerIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        addToHistory(title);
    }

    function showSection(name, element) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name + '-sec').classList.add('active');
        if(element) element.classList.add('active');
    }

    function addToHistory(title) {
        const list = document.getElementById('history-list');
        list.innerHTML = `<div class="list-item"><i class="fas fa-check-circle text-success me-2"></i>${title}</div>` + list.innerHTML;
    }

    function handleSearch() {
        const val = document.getElementById('searchInput').value;
        if(val.includes('youtube.com') || val.includes('youtu.be')) {
            let vid = val.split('v=')[1] || val.split('/').pop();
            playThis(val, vid, "Custom Link Video");
        } else {
            currentQuery = val;
            nextPageToken = "";
            loadVideos(val);
            showSection('home');
        }
    }

    function startDownload(q) {
        if(!playingUrl) return alert("প্রথমে একটি ভিডিও প্লে করুন।");
        alert("ডাউনলোড প্রসেস হচ্ছে, অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন...");
        window.location.href = `/download?url=${encodeURIComponent(playingUrl)}&quality=${q}`;
    }

    window.onload = () => loadVideos(currentQuery);
</script>

</body>
    </html>
